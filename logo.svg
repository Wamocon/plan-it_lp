<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="plan-IT Logo">
  <defs>
    <linearGradient id="ap-topface" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#ff5050"/>
    </linearGradient>
    <linearGradient id="ap-topfront" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </linearGradient>
    <linearGradient id="ap-midface" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>
    <linearGradient id="ap-midfront" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <linearGradient id="ap-botface" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="ap-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Layer 3 (bottom) -->
  <polygon points="24,70 98,70 84,79 10,79" fill="url(#ap-botface)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="10" y="79" width="74" height="14" fill="url(#ap-midfront)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <rect x="22.12" y="81.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.2)"/>
  <rect x="22.12" y="85.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.2)"/>
  <rect x="42.10" y="81.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.2)"/>
  <rect x="42.10" y="85.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.2)"/>
  <rect x="62.08" y="81.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.2)"/>
  <rect x="62.08" y="85.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.2)"/>

  <!-- Layer 2 (middle) -->
  <polygon points="24,38 98,38 84,47 10,47" fill="url(#ap-midface)" stroke="rgba(255,255,255,0.30)" stroke-width="1"/>
  <rect x="10" y="47" width="74" height="14" fill="url(#ap-midfront)" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
  <rect x="22.12" y="49.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.3)"/>
  <rect x="22.12" y="53.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.3)"/>
  <rect x="42.10" y="49.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.3)"/>
  <rect x="42.10" y="53.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.3)"/>
  <rect x="62.08" y="49.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.3)"/>
  <rect x="62.08" y="53.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,255,255,0.3)"/>
  <!-- Arrow L2→L3 -->
  <polyline points="88,54 88,78 86,81 90,81" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Layer 1 (top, red) with glow -->
  <g filter="url(#ap-glow)">
    <polygon points="24,6 98,6 84,15 10,15" fill="url(#ap-topface)" stroke="rgba(255,100,100,0.6)" stroke-width="1"/>
    <rect x="10" y="15" width="74" height="14" fill="url(#ap-topfront)" stroke="rgba(255,80,80,0.4)" stroke-width="0.8"/>
  </g>
  <!-- Highlight line -->
  <line x1="14" y1="18" x2="80" y2="18" stroke="rgba(255,180,180,0.35)" stroke-width="1" stroke-linecap="round"/>
  <!-- Top layer dots (brighter) -->
  <rect x="22.12" y="17.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,200,200,0.55)"/>
  <rect x="22.12" y="21.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,200,200,0.55)"/>
  <rect x="42.10" y="17.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,200,200,0.55)"/>
  <rect x="42.10" y="21.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,200,200,0.55)"/>
  <rect x="62.08" y="17.72" width="2.4" height="2.4" rx="0.6" fill="rgba(255,200,200,0.55)"/>
  <rect x="62.08" y="21.50" width="2.4" height="2.4" rx="0.6" fill="rgba(255,200,200,0.55)"/>
  <!-- Arrow L1→L2 -->
  <polyline points="88,22 88,46 86,49 90,49" stroke="rgba(255,80,80,0.45)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
