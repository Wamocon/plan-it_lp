name: CI – Regression & Checks
# last updated: 2026-03-15

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

jobs:
  regression-tests:
    name: Regression Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: reports/ Verzeichnis anlegen
        run: mkdir -p reports

      - name: jest-junit für CI-Reporting installieren
        run: npm install jest-junit --no-save

      - name: Regression Tests ausführen
        run: npm run test:ci

      - name: Test-Report als GitHub Actions Summary veröffentlichen
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 'Jest Regression Report'
          path: 'reports/jest-junit.xml'
          reporter: 'jest-junit'
          fail-on-error: false

      - name: Test-Artefakt hochladen (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-regression-report
          path: reports/jest-junit.xml
          retention-days: 30

  html-lint:
    name: HTML Validierung (HTMLHint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reports/ Verzeichnis anlegen
        run: mkdir -p reports

      - name: HTMLHint ausführen (mit Report)
        run: |
          npx htmlhint@latest "*.html" --format=json > reports/htmlhint-report.json 2>&1 || true
          npx htmlhint@latest "*.html"

      - name: HTMLHint Summary in GitHub Actions schreiben
        if: always()
        run: |
          echo '## HTMLHint Validierung' >> $GITHUB_STEP_SUMMARY
          if [ -f reports/htmlhint-report.json ]; then
            COUNT=$(python3 -c "import json,sys; d=json.load(open('reports/htmlhint-report.json')); print(sum(len(f.get('messages',[])) for f in d))")
            if [ "$COUNT" = "0" ]; then
              echo '✅ Keine Probleme gefunden' >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $COUNT Probleme gefunden" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: HTMLHint-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlhint-report
          path: reports/htmlhint-report.json
          retention-days: 30
