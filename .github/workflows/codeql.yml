name: CodeQL – Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL-Analyse ausführen
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  analyze-python:
    # Verhindert, dass GitHub Default-Setup Python separat analysiert.
    # continue-on-error: true, da das Projekt nur ein einzelnes Hilfs-Script
    # in Python enthält und keine vollständige Python-Datenbank erstellt werden kann.
    name: Analyze (python)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: CodeQL-Analyse ausführen
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'
